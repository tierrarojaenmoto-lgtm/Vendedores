function formatMoney(n) {
  return "$" + Math.round(n || 0).toLocaleString("es-AR");
}

function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric" }) +
    " · " + d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
}

function fmtTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === "\r") { }
      else field += c;
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}

function receiptToText(r) {
  const lines = [];
  lines.push("📋 *RECIBO DE VENTA - GP DISTRIBUCIONES*");
  lines.push("Negocio: *" + r.businessName + "*");
  lines.push("ID: " + r.id);
  lines.push("Fecha: " + fmtDate(r.date));
  lines.push("──────────────────────────");
  r.items.forEach(it => {
    const lineTotal = it.lineTotal != null ? it.lineTotal : it.price * it.qty;
    const discountTag = it.discountPercent > 0 ? " [-" + it.discountPercent + "%]" : "";
    lines.push(`• ${it.qty}x ${it.desc}${discountTag} → ${formatMoney(lineTotal)}`);
  });
  lines.push("──────────────────────────");
  if (r.discountAmount > 0) {
    lines.push("Subtotal: " + formatMoney(r.subtotal));
    lines.push("Descuento total: -" + formatMoney(r.discountAmount));
  }
  lines.push("*TOTAL A PAGAR: " + formatMoney(r.total) + "*");
  lines.push("\n_¡Muchas gracias por su compra!_");
  return lines.join("\n");
}

function consolidateReceipts(receipts) {
  const totalsByCode = {};
  let grandTotal = 0;
  let grandProfit = 0;
  receipts.forEach(r => {
    grandTotal += r.total || 0;
    grandProfit += r.totalProfit != null ? r.totalProfit : 0;
    (r.items || []).forEach(it => {
      if (!totalsByCode[it.code]) {
        totalsByCode[it.code] = { desc: it.desc, qty: 0, subtotal: 0, profit: 0 };
      }
      const lineTotal = it.lineTotal != null ? it.lineTotal : it.price * it.qty;
      const lineProfit = it.lineProfit != null ? it.lineProfit : 0;
      totalsByCode[it.code].qty += it.qty;
      totalsByCode[it.code].subtotal += lineTotal;
      totalsByCode[it.code].profit += lineProfit;
    });
  });
  const lines = Object.values(totalsByCode).sort((a, b) => a.desc.localeCompare(b.desc));
  return { lines, grandTotal, grandProfit, saleCount: receipts.length };
}

function generateReportPDF(receipts) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const { lines, grandTotal, grandProfit, saleCount } = consolidateReceipts(receipts);
  let y = 22;

  doc.setFillColor(15, 47, 40);
  doc.rect(0, 0, 210, 32, "F");

  doc.setTextColor(255, 255, 255);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(18);
  doc.text("Reporte Consolidado de Ventas", 14, 18);
  doc.setFontSize(10);
  doc.setFont("helvetica", "normal");
  doc.text(fmtDate(Date.now()) + " · " + saleCount + " operaciones concretadas", 14, 26);

  y = 42;
  doc.setTextColor(50, 50, 50);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(10);
  doc.text("Artículo / Producto", 14, y);
  doc.text("Cant.", 138, y);
  doc.text("Subtotal", 170, y);

  doc.setDrawColor(210, 210, 210);
  doc.setLineWidth(0.5);
  doc.line(14, y + 2, 196, y + 2);
  y += 9;

  doc.setFont("helvetica", "normal");
  lines.forEach(l => {
    const descLines = doc.splitTextToSize(l.desc, 120);
    if (y + descLines.length * 5 > 270) {
      doc.addPage();
      y = 20;
    }
    doc.text(descLines, 14, y);
    doc.text(String(l.qty), 138, y);
    doc.text(formatMoney(l.subtotal), 170, y);
    y += Math.max(descLines.length, 1) * 5 + 3;
  });

  y += 4;
  doc.line(14, y, 196, y);
  y += 10;

  doc.setFont("helvetica", "bold");
  doc.setFontSize(13);
  doc.setTextColor(15, 47, 40);
  doc.text("TOTAL FACTURADO: " + formatMoney(grandTotal), 14, y);
  y += 7;
  doc.setFontSize(11);
  doc.setTextColor(29, 122, 104);
  doc.text("MARGEN / GANANCIA: " + formatMoney(grandProfit), 14, y);

  return doc;
}

// Canvas Receipt Renderer (High DPI PNG)
function renderReceiptCanvas(receipt) {
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  const dpr = 2;
  const width = 420;
  
  // Calculate dynamic height
  const itemHeight = receipt.items.length * 28;
  const baseHeight = 360 + itemHeight + (receipt.discountAmount > 0 ? 30 : 0);
  canvas.width = width * dpr;
  canvas.height = baseHeight * dpr;
  ctx.scale(dpr, dpr);

  // Background paper
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, width, baseHeight);

  // Top header banner
  ctx.fillStyle = "#0F2F28";
  ctx.fillRect(0, 0, width, 68);

  ctx.fillStyle = "#E5A93C";
  ctx.font = "bold 16px 'Plus Jakarta Sans', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("GP DISTRIBUCIONES", width / 2, 28);
  ctx.fillStyle = "#FFFFFF";
  ctx.font = "11px 'Plus Jakarta Sans', sans-serif";
  ctx.fillText("COMPROBANTE DE ENTREGA Y PAGO", width / 2, 48);

  // Metadata
  ctx.textAlign = "left";
  ctx.fillStyle = "#334155";
  ctx.font = "bold 13px 'Plus Jakarta Sans', sans-serif";
  ctx.fillText(receipt.businessName, 20, 95);

  ctx.fillStyle = "#64748B";
  ctx.font = "10px 'JetBrains Mono', monospace";
  ctx.fillText("ID: " + receipt.id, 20, 112);
  ctx.fillText("Fecha: " + fmtDate(receipt.date), 20, 126);

  // Dashed separator
  ctx.strokeStyle = "#CBD5E1";
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(20, 140);
  ctx.lineTo(width - 20, 140);
  ctx.stroke();

  // Column headers
  ctx.fillStyle = "#94A3B8";
  ctx.font = "bold 10px 'JetBrains Mono', monospace";
  ctx.fillText("DESCRIPCIÓN", 20, 158);
  ctx.textAlign = "right";
  ctx.fillText("IMPORTE", width - 20, 158);

  // Items
  let curY = 182;
  receipt.items.forEach(it => {
    ctx.textAlign = "left";
    ctx.fillStyle = "#1E293B";
    ctx.font = "500 11px 'JetBrains Mono', monospace";
    const lineTotal = it.lineTotal != null ? it.lineTotal : it.price * it.qty;
    const descText = `${it.qty}x ${it.desc}`;
    const truncated = descText.length > 30 ? descText.substring(0, 28) + "…" : descText;
    ctx.fillText(truncated, 20, curY);

    if (it.discountPercent > 0) {
      ctx.fillStyle = "#D97706";
      ctx.font = "bold 9px 'JetBrains Mono', monospace";
      ctx.fillText(`(-${it.discountPercent}%)`, 20, curY + 12);
    }

    ctx.textAlign = "right";
    ctx.fillStyle = "#0F2F28";
    ctx.font = "bold 11px 'JetBrains Mono', monospace";
    ctx.fillText(formatMoney(lineTotal), width - 20, curY);
    curY += 26;
  });

  // Dashed separator
  ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(20, curY + 4);
  ctx.lineTo(width - 20, curY + 4);
  ctx.stroke();
  curY += 22;

  // Subtotal & discount if present
  if (receipt.discountAmount > 0) {
    ctx.textAlign = "left";
    ctx.fillStyle = "#64748B";
    ctx.font = "11px 'JetBrains Mono', monospace";
    ctx.fillText("Subtotal", 20, curY);
    ctx.textAlign = "right";
    ctx.fillText(formatMoney(receipt.subtotal), width - 20, curY);
    curY += 18;

    ctx.textAlign = "left";
    ctx.fillStyle = "#B45309";
    ctx.fillText("Ahorro aplicado", 20, curY);
    ctx.textAlign = "right";
    ctx.fillText("-" + formatMoney(receipt.discountAmount), width - 20, curY);
    curY += 20;
  }

  // Final Total Banner
  ctx.fillStyle = "#F8FAFC";
  ctx.fillRect(20, curY, width - 40, 42);
  ctx.strokeStyle = "#0F2F28";
  ctx.setLineDash([]);
  ctx.strokeRect(20, curY, width - 40, 42);

  ctx.textAlign = "left";
  ctx.fillStyle = "#0F2F28";
  ctx.font = "bold 12px 'Plus Jakarta Sans', sans-serif";
  ctx.fillText("TOTAL A COBRAR", 32, curY + 26);

  ctx.textAlign = "right";
  ctx.font = "bold 16px 'JetBrains Mono', monospace";
  ctx.fillText(formatMoney(receipt.total), width - 32, curY + 27);

  // Footer note
  curY += 66;
  ctx.textAlign = "center";
  ctx.fillStyle = "#94A3B8";
  ctx.font = "italic 10px 'Plus Jakarta Sans', sans-serif";
  ctx.fillText("¡Gracias por confiar en GP Distribuciones!", width / 2, curY);

  return canvas.toDataURL("image/png");
}

          const parsed = parseCSV(text);
          if (parsed.length > 1) {
            const headers = parsed[0].map(h => (h || "").toLowerCase().trim());
            const nameIdx = headers.findIndex(h => h.includes("producto") || h.includes("desc") || h.includes("articulo") || h.includes("nombre"));
            const priceIdx = headers.findIndex(h => h.includes("venta") || (h.includes("precio") && !h.includes("costo")));
            const costIdx = headers.findIndex(h => h.includes("costo"));
            const catIdx = headers.findIndex(h => h.includes("cat") || h.includes("rubro"));
            const codeIdx = headers.findIndex(h => h.includes("cod"));

            if (nameIdx !== -1 && priceIdx !== -1) {
              const list = [];
              for (let i = 1; i < parsed.length; i++) {
                const r = parsed[i];
                if (!r || !r[nameIdx]) continue;
                const p = parseFloat(String(r[priceIdx]).replace(/[^\d.-]/g, "")) || 0;
                const c = costIdx !== -1 ? (parseFloat(String(r[costIdx]).replace(/[^\d.-]/g, "")) || 0) : 0;
                list.push({
                  code: (codeIdx !== -1 && r[codeIdx]) ? String(r[codeIdx]).trim() : "SHEET-" + i,
                  desc: String(r[nameIdx]).trim(),
                  price: p,
                  cost: c,
                  category: (catIdx !== -1 && r[catIdx]) ? String(r[catIdx]).trim() : "General",
                  offer: false
                });
              }
              if (list.length > 0) {
                setItems(list);
                setCatalogSource("remote");
                setLastSync(Date.now());
                notify(`Catálogo sincronizado: ${list.length} productos`);
                success = true;
                break;
              }
            }
          }
        }
      } catch (e) {
        // try next endpoint
      }
    }
    if (!success) {
      setCatalogSource("local");
      notify("Sin conexión con la hoja: revisá que esté compartida como pública");
    }
  }, []);

  // Sincroniza con la hoja apenas se abre la app, sin esperar a que
  // el usuario toque el botón de refrescar.
  useEffect(() => {
    syncFromSheet();
  }, [syncFromSheet]);

  // Persistent storage
  useEffect(() => {
    localStorage.setItem("vendedores_current_cart", JSON.stringify(cart));
  }, [cart]);
  useEffect(() => {
    localStorage.setItem("vendedores_current_discounts", JSON.stringify(itemDiscounts));
  }, [itemDiscounts]);
  useEffect(() => {
    localStorage.setItem("vendedores_receipts", JSON.stringify(sessionReceipts));
  }, [sessionReceipts]);
  useEffect(() => {
    localStorage.setItem("vendedores_saved_clients", JSON.stringify(savedClients));
  }, [savedClients]);
  useEffect(() => {
    localStorage.setItem("vendedores_local_items", JSON.stringify(localItems));
  }, [localItems]);

  const allItems = useMemo(() => [...items, ...localItems], [items, localItems]);

  // Categories extraction
  const categories = useMemo(() => {
    const set = new Set(["Todos", "Ofertas"]);
    allItems.forEach(i => {
      if (i.category) set.add(i.category);
    });
    return Array.from(set);
  }, [allItems]);

  // Filtered Products
  const filteredProducts = useMemo(() => {
    let res = allItems;
    if (selectedCategory === "Ofertas") {
      res = res.filter(i => i.offer);
    } else if (selectedCategory !== "Todos") {
      res = res.filter(i => (i.category || "").toLowerCase() === selectedCategory.toLowerCase());
    }
    if (query.trim()) {
      const q = query.toLowerCase();
      res = res.filter(i => i.desc.toLowerCase().includes(q) || (i.code && i.code.toLowerCase().includes(q)));
    }
    return res;
  }, [allItems, selectedCategory, query]);

  // Cart summary
  const cartLines = useMemo(() => {
    const list = [];
    Object.entries(cart).forEach(([code, qty]) => {
      if (qty <= 0) return;
      const item = allItems.find(i => i.code === code);
      if (!item) return;
      const discount = Math.min(100, Math.max(0, Number(itemDiscounts[code]) || 0));
      const subtotal = item.price * qty;
      const discountAmount = subtotal * (discount / 100);
      const total = subtotal - discountAmount;
      const totalCost = (Number(item.cost) || 0) * qty;
      const profit = total - totalCost;
      list.push({ ...item, qty, discount, subtotal, discountAmount, total, totalCost, profit });
    });
    return list;
  }, [cart, allItems, itemDiscounts]);

  const totalCartQty = cartLines.reduce((acc, it) => acc + it.qty, 0);
  const cartSubtotal = cartLines.reduce((acc, it) => acc + it.subtotal, 0);
  const cartDiscount = cartLines.reduce((acc, it) => acc + it.discountAmount, 0);
  const cartTotal = cartSubtotal - cartDiscount;

  // Receipts KPI
  const totalSalesRevenue = useMemo(() => sessionReceipts.reduce((a, r) => a + (r.total || 0), 0), [sessionReceipts]);
  const totalSalesProfit = useMemo(() => sessionReceipts.reduce((a, r) => a + (r.totalProfit != null ? r.totalProfit : 0), 0), [sessionReceipts]);

  // Client Ranking Stats
  const clientRankings = useMemo(() => {
    const map = {};
    sessionReceipts.forEach(r => {
      const name = r.businessName || "Consumidor Final";
      if (!map[name]) map[name] = { total: 0, profit: 0, orders: 0 };
      map[name].total += r.total || 0;
      map[name].profit += r.totalProfit || 0;
      map[name].orders += 1;
    });
    return Object.entries(map)
      .map(([name, stats]) => ({ name, ...stats }))
      .sort((a, b) => b.total - a.total);
  }, [sessionReceipts]);

  // Stepper Actions
  const updateQty = (code, delta) => {
    setCart(prev => {
      const current = prev[code] || 0;
      const next = current + delta;
      const copy = { ...prev };
      if (next <= 0) delete copy[code];
      else copy[code] = next;
      return copy;
    });
  };

  const handlePromptQty = (code, currentQty) => {
    const input = prompt("Ingresa la cantidad deseada:", currentQty || "1");
    if (input !== null) {
      const parsed = parseInt(input, 10);
      if (!isNaN(parsed) && parsed >= 0) {
        setCart(prev => {
          const copy = { ...prev };
          if (parsed === 0) delete copy[code];
          else copy[code] = parsed;
          return copy;
        });
      }
    }
  };

  const toggleOfferFlag = (code) => {
    // Check if in local items or items
    setLocalItems(prev => prev.map(it => it.code === code ? { ...it, offer: !it.offer } : it));
    setItems(prev => prev.map(it => it.code === code ? { ...it, offer: !it.offer } : it));
    notify("Estado de oferta actualizado");
  };

  const setDiscount = (code, val) => {
    const num = val === "" ? 0 : Math.min(100, Math.max(0, Number(val) || 0));
    setItemDiscounts(prev => ({ ...prev, [code]: num }));

  const clearCart = () => {

  // Save to physical folder if supported or trigger direct download
  const saveReceiptToDevice = async (receipt) => {
    try {
      const dataUrl = renderReceiptCanvas(receipt);
      const filename = `Recibo_${receipt.businessName.replace(/[^a-zA-Z0-9]/g, "_")}_${receipt.id}.png`;
      
      if (window.showDirectoryPicker && dirHandle) {
        try {
          const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
          const writable = await fileHandle.createWritable();
          const blob = await (await fetch(dataUrl)).blob();
          await writable.write(blob);
          await writable.close();
          notify("Recibo guardado en la carpeta elegida");
          return;
        } catch (err) {
          console.warn("Directory handle error, falling back to download", err);
        }
      }

      // Download Fallback
      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = filename;
      a.click();
      notify("Ticket PNG descargado");

      notify("Error al generar imagen PNG");

  // Register Checkout Sale
  const registerSale = () => {

    const receipt = {

        lineProfit: l.profit

      discountAmount: cartDiscount,
      total: cartTotal,
      totalProfit: cartLines.reduce((a, b) => a + b.profit, 0)
    };

    setSessionReceipts(prev => [receipt, ...prev]);
    if (!savedClients.includes(businessName.trim())) {
      setSavedClients(prev => [businessName.trim(), ...prev.slice(0, 25)]);

    // Auto-save PNG image silently
    try {

    setCart({});
    setItemDiscounts({});

    notify("Abriendo WhatsApp y descargando PDF");

  const copyReceiptText = (receipt) => {

    setAddProductModal(false);
    notify("Producto agregado al catálogo");
  };

  // Recalculate and update receipt being edited
  const saveReceiptEdits = () => {
    if (!editingReceipt) return;
    let sub = 0;
    let disc = 0;
    let totProfit = 0;

    const recalculatedItems = editingReceipt.items.map(it => {
      const lineSub = it.price * it.qty;
      const lineDisc = lineSub * ((it.discountPercent || 0) / 100);
      const lineTot = lineSub - lineDisc;
      const lineCost = (Number(it.cost) || 0) * it.qty;
      const lineProf = lineTot - lineCost;
      sub += lineSub;
      disc += lineDisc;
      totProfit += lineProf;
      return {
        ...it,
        lineTotal: lineTot,
        lineProfit: lineProf
      };
    });

    const updated = {
      ...editingReceipt,
      items: recalculatedItems,
      subtotal: sub,
      discountAmount: disc,
      total: sub - disc,
      totalProfit: totProfit
    };

    setSessionReceipts(prev => prev.map(r => r.id === updated.id ? updated : r));
    setEditingReceipt(null);
    notify("Recibo actualizado con éxito");
  };

  // Choose folder for File System Access API
  const handleSelectFolder = async () => {
    if (window.showDirectoryPicker) {
      try {
        const handle = await window.showDirectoryPicker();
        setDirHandle(handle);
        notify(`Carpeta vinculada: ${handle.name}`);
      } catch (err) {
        console.warn("Folder selection dismissed");
      }
    } else {
      alert("Tu navegador actual no soporta acceso directo al sistema de carpetas. Los archivos se descargarán de forma directa.");
    }
  };

  // Full backup export & import
  const exportFullBackup = () => {
    const backupData = {
      date: new Date().toISOString(),
      localItems,
      sessionReceipts,
      savedClients
    };
    const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `Backup_GP_Vendedores_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    notify("Backup JSON descargado");
  };

  const handleImportBackup = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const data = JSON.parse(event.target.result);
        if (data.sessionReceipts) setSessionReceipts(data.sessionReceipts);
        if (data.localItems) setLocalItems(data.localItems);
        if (data.savedClients) setSavedClients(data.savedClients);
        notify("Backup restaurado con éxito");
        setSettingsModal(false);
      } catch (err) {
        notify("Archivo de backup no válido");
      }
    };
    reader.readAsText(file);
  };

  return (
    <div className="flex flex-col flex-1 min-h-screen">
      {/* Top Mobile Bar */}
      <header className="bg-brand-800 text-white pt-4 pb-3.5 px-4 sticky top-0 z-30 shadow-md">
        <div className="flex items-center justify-between gap-2.5">
          <div className="flex items-center gap-2.5 min-w-0">
            <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-accent to-[#F3C46C] text-brand-900 flex items-center justify-center font-black text-xl shadow-md flex-shrink-0">
              V
            </div>
            <div className="min-w-0">
              <div className="flex items-center gap-1.5 flex-wrap">
                <h1 className="font-extrabold text-[15px] tracking-tight text-white leading-none">GP Vendedores</h1>
                <span className="text-[10px] bg-white/10 px-2 py-0.5 rounded-full font-bold text-emerald-300">
                  {catalogSource === "loading" ? "Sincronizando..." : `${allItems.length} arts`}
                </span>
              </div>
              <p className="text-[11px] text-emerald-100/70 font-medium truncate mt-1">
                {catalogSource === "remote" ? `En línea · ${fmtTime(lastSync)}` : "Modo local rápido"}
              </p>
            </div>
          </div>

          <div className="flex items-center gap-1.5 flex-shrink-0">
            <button
              onClick={syncFromSheet}
              className="w-9 h-9 rounded-xl bg-white/10 hover:bg-white/20 text-white flex items-center justify-center tap-bounce"
              title="Sincronizar Google Sheets"
            >
              <RefreshIcon size={16} />
            </button>
            <button
              onClick={() => setSettingsModal(true)}
              className="w-9 h-9 rounded-xl bg-white/10 hover:bg-white/20 text-white flex items-center justify-center tap-bounce"
              title="Configuración y Backup"
            >
              <SettingsIcon size={16} />
            </button>
            <button
              onClick={() => setStatsExpanded(!statsExpanded)}
              className={`h-9 px-2.5 rounded-xl font-mono font-bold text-xs flex items-center gap-1 tap-bounce transition-all ${
                statsExpanded ? 'bg-accent text-brand-900 shadow-md' : 'bg-white/10 text-white'
              }`}
            >
              <span>{formatMoney(totalSalesRevenue)}</span>
            </button>
          </div>
        </div>

        {/* Dynamic Drawer KPI Header */}
        {statsExpanded && (
          <div className="mt-3 p-3 bg-brand-900/90 rounded-2xl border border-white/10 text-xs flex justify-between items-center animate-in fade-in slide-in-from-top-2">
            <div>
              <span className="text-white/60 block text-[10px] font-semibold uppercase tracking-wider">Ventas Totales</span>
              <span className="text-accent font-black text-sm font-mono">{formatMoney(totalSalesRevenue)}</span>
            </div>

              <span className="text-emerald-400 font-bold text-sm font-mono">+{formatMoney(totalSalesProfit)}</span>

            <div className="text-right">

        {/* Tab Navigation Segment */}
        <div className="grid grid-cols-3 gap-1 bg-black/25 p-1 rounded-2xl mt-3">
          <button
            onClick={() => setActiveTab("catalog")}
            className={`py-2 text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-1.5 ${
              activeTab === "catalog" ? "bg-white text-brand-900 shadow-sm" : "text-white/75 hover:text-white"
            }`}
          >
            <PackageIcon size={15} /> Catálogo
          </button>
          <button
            onClick={() => setActiveTab("cart")}
            className={`py-2 text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-1.5 relative ${
              activeTab === "cart" ? "bg-white text-brand-900 shadow-sm" : "text-white/75 hover:text-white"
            }`}
          >
            <CartIcon size={15} /> Carrito
            {totalCartQty > 0 && (
              <span className="bg-accent text-brand-900 text-[10px] font-black px-1.5 py-0.2 rounded-full shadow-sm ml-0.5">
                {totalCartQty}
              </span>
            )}
          </button>
          <button
            onClick={() => setActiveTab("receipts")}
            className={`py-2 text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-1.5 relative ${

          >
            <ClockIcon size={15} /> Recibos
            {sessionReceipts.length > 0 && (
              <span className="bg-white/20 text-white text-[10px] px-1.5 py-0.2 rounded-full font-bold ml-0.5">
                {sessionReceipts.length}
              </span>

      </header>

      {/* Main Container */}

        {activeTab === "catalog" && (
          <div className="space-y-3">
            {/* Search & Add Product */}
            <div className="flex items-center gap-2">
              <div className="flex-1 relative">
                <div className="absolute inset-y-0 left-3.5 flex items-center pointer-events-none text-slate-400">
                  <SearchIcon size={17} />
                </div>
                <input
                  type="text"
                  value={query}
                  onChange={e => setQuery(e.target.value)}
                  placeholder="Buscar medicamento o código..."
                  className="w-full bg-white pl-10 pr-8 py-3 rounded-2xl text-sm border border-slate-200 shadow-soft focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 font-medium placeholder:text-slate-400"
                />

                  >

                className="w-full bg-[#25D366] hover:bg-[#20be5c] text-white font-black py-3.5 rounded-2xl flex items-center justify-center gap-2 text-sm tap-bounce shadow-md"
              >
                <ShareIcon size={16} /> Enviar por WhatsApp
              </button>

              <button
                onClick={() => {
                  copyReceiptText(successReceipt);
                  setSuccessReceipt(null);
                }}
                className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-2xl flex items-center justify-center gap-2 text-xs tap-bounce"
              >
                <CopyIcon size={15} /> Copiar texto
              </button>

              <button
                onClick={() => setSuccessReceipt(null)}
                className="w-full py-2.5 text-xs text-slate-400 font-bold hover:text-slate-600"
              >
                Cerrar y Nueva Venta
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ===================== MODAL: VIEW TICKET DETAIL ===================== */}
      {selectedReceipt && (
        <div className="fixed inset-0 bg-black/65 z-50 flex items-end justify-center p-0 backdrop-blur-xs" onClick={() => setSelectedReceipt(null)}>
          <div
            onClick={e => e.stopPropagation()}
            className="w-full max-w-[480px] bg-white rounded-t-3xl p-5 space-y-4 max-h-[92vh] overflow-y-auto"
          >
            <div className="flex items-start justify-between">
              <div>
                <span className="text-[10px] font-mono text-brand-800 font-bold bg-brand-50 px-2 py-0.5 rounded-md">
                  COMPROBANTE OFICIAL
                </span>
                <h3 className="font-black text-lg text-slate-900 mt-1">{selectedReceipt.businessName}</h3>
                <p className="text-xs text-slate-400">{fmtDate(selectedReceipt.date)}</p>
              </div>
              <button onClick={() => setSelectedReceipt(null)} className="p-1.5 text-slate-400 hover:bg-slate-100 rounded-full">
                <XIcon size={20} />
              </button>
            </div>

            {/* Receipt layout container */}
            <div className="bg-[#FAF9F5] p-4 rounded-2xl border border-dashed border-slate-300 font-mono text-xs space-y-2.5 shadow-inner">
              <div className="text-center pb-2 border-b border-dashed border-slate-300 font-sans">
                <h4 className="font-black text-slate-800 text-sm tracking-tight">GP DISTRIBUCIONES</h4>
                <p className="text-[10px] text-slate-500 uppercase tracking-wider">Recibo de Entrega y Cobranza</p>
              </div>

              <div className="space-y-1.5 pt-1">
                {selectedReceipt.items.map((it, idx) => (
                  <div key={idx} className="flex justify-between items-start gap-2">
                    <span className="flex-1 text-slate-700">
                      {it.qty}x {it.desc}
                      {it.discountPercent > 0 && <span className="text-amber-700 text-[10px] font-bold"> (-{it.discountPercent}%)</span>}
                    </span>
                    <span className="font-bold text-slate-900">
                      {formatMoney(it.lineTotal != null ? it.lineTotal : it.price * it.qty)}
                    </span>
                  </div>
                ))}
              </div>

              <div className="border-t border-dashed border-slate-300 pt-2 space-y-1">
                {selectedReceipt.discountAmount > 0 && (
                  <>
                    <div className="flex justify-between text-slate-500 text-[11px]">
                      <span>Subtotal:</span>
                      <span>{formatMoney(selectedReceipt.subtotal)}</span>
                    </div>
                    <div className="flex justify-between text-amber-800 text-[11px] font-bold">
                      <span>Descuento aplicado:</span>
                      <span>-{formatMoney(selectedReceipt.discountAmount)}</span>
                    </div>
                  </>
                )}
                <div className="flex justify-between text-base font-black text-slate-900 pt-1 border-t border-slate-200 font-sans">
                  <span>TOTAL FINAL:</span>
                  <span className="font-mono text-brand-800">{formatMoney(selectedReceipt.total)}</span>
                </div>
                {selectedReceipt.totalProfit != null && (
                  <div className="flex justify-between text-[11px] font-bold text-emerald-700 pt-0.5">
                    <span>Margen estimado:</span>
                    <span>+{formatMoney(selectedReceipt.totalProfit)}</span>
                  </div>
                )}
              </div>
            </div>

            {/* Action Buttons */}
            <div className="grid grid-cols-3 gap-2 pt-1">
              <button
                onClick={() => shareViaWhatsApp(selectedReceipt)}
                className="bg-[#25D366] hover:bg-[#20be5c] text-white font-bold py-3 px-2 rounded-2xl flex items-center justify-center gap-1.5 text-xs tap-bounce shadow-sm"
              >
                <ShareIcon size={15} /> WhatsApp
              </button>
              <button
                onClick={() => saveReceiptToDevice(selectedReceipt)}
                className="bg-brand-800 hover:bg-brand-900 text-white font-bold py-3 px-2 rounded-2xl flex items-center justify-center gap-1.5 text-xs tap-bounce shadow-sm"
              >
                <DownloadIcon size={15} /> Guardar PNG
              </button>
              <button
                onClick={() => copyReceiptText(selectedReceipt)}
                className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 px-2 rounded-2xl flex items-center justify-center gap-1.5 text-xs tap-bounce"
              >
                <CopyIcon size={15} /> Copiar
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ===================== MODAL: EDIT RECEIPT ===================== */}
      {editingReceipt && (
        <div className="fixed inset-0 bg-black/65 z-50 flex items-end justify-center p-0 backdrop-blur-xs" onClick={() => setEditingReceipt(null)}>
          <div
            onClick={e => e.stopPropagation()}
            className="w-full max-w-[480px] bg-white rounded-t-3xl p-5 space-y-3.5 max-h-[92vh] overflow-y-auto animate-in slide-in-from-bottom duration-200"
          >
            <div className="flex items-center justify-between">
              <div>
                <h3 className="font-black text-lg text-slate-900">Editar Recibo {editingReceipt.id}</h3>
                <p className="text-xs text-slate-500">Modifica artículos, cantidades o descuentos</p>
              </div>
              <button onClick={() => setEditingReceipt(null)} className="p-1.5 text-slate-400 hover:bg-slate-100 rounded-full">
                <XIcon size={20} />
              </button>
            </div>

            <div>
              <label className="block text-[11px] font-bold text-slate-600 uppercase mb-1">Cliente</label>
              <input
                type="text"
                value={editingReceipt.businessName}
                onChange={e => setEditingReceipt({ ...editingReceipt, businessName: e.target.value })}
                className="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-300 font-bold text-sm"
              />
            </div>

            {/* List of items inside receipt */}
            <div className="space-y-2 max-h-56 overflow-y-auto no-scrollbar">
              <span className="text-[11px] font-bold text-slate-400 block">Artículos en este comprobante:</span>
              {editingReceipt.items.map((it, idx) => (
                <div key={idx} className="p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs space-y-2">
                  <div className="flex justify-between items-start">
                    <span className="font-bold text-slate-800 flex-1">{it.desc}</span>
                    <button
                      onClick={() => {
                        const next = editingReceipt.items.filter((_, i) => i !== idx);
                        setEditingReceipt({ ...editingReceipt, items: next });
                      }}
                      className="text-rose-500 hover:text-rose-700 p-1"
                    >
                      <TrashIcon size={14} />
                    </button>
                  </div>
                  <div className="flex items-center justify-between gap-2">
                    <div className="flex items-center gap-1">
                      <span className="text-slate-500 text-[10px]">Cant:</span>
                      <input
                        type="number"
                        min="1"
                        value={it.qty}
                        onChange={e => {
                          const val = Math.max(1, parseInt(e.target.value, 10) || 1);
                          const next = [...editingReceipt.items];
                          next[idx].qty = val;
                          setEditingReceipt({ ...editingReceipt, items: next });
                        }}
                        className="w-12 bg-white border border-slate-300 rounded-lg p-1 text-center font-bold font-mono"
                      />
                    </div>
                    <div className="flex items-center gap-1">
                      <span className="text-slate-500 text-[10px]">Desc %:</span>
                      <input
                        type="number"
                        min="0"
                        max="100"
                        value={it.discountPercent || ""}
                        placeholder="0"
                        onChange={e => {
                          const val = Math.min(100, Math.max(0, parseFloat(e.target.value) || 0));
                          const next = [...editingReceipt.items];
                          next[idx].discountPercent = val;
                          setEditingReceipt({ ...editingReceipt, items: next });
                        }}
                        className="w-12 bg-white border border-slate-300 rounded-lg p-1 text-center font-bold font-mono"
                      />
                    </div>
                    <span className="font-mono font-bold text-slate-900">
                      {formatMoney((it.price * it.qty) * (1 - (it.discountPercent || 0) / 100))}
                    </span>
                  </div>
                </div>
              ))}
            </div>

            {/* Quick add product to this receipt */}
            <div className="pt-2 border-t border-slate-200">
              <span className="text-[11px] font-bold text-slate-600 block mb-1">Agregar producto del catálogo:</span>
              <input
                type="text"
                placeholder="Buscar para sumar..."
                value={editItemSearch}
                onChange={e => setEditItemSearch(e.target.value)}
                className="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-300 text-xs mb-1.5"
              />
              {editItemSearch.trim() && (
                <div className="max-h-28 overflow-y-auto no-scrollbar space-y-1 bg-slate-100 p-1.5 rounded-xl">
                  {allItems
                    .filter(i => i.desc.toLowerCase().includes(editItemSearch.toLowerCase()))
                    .slice(0, 5)
                    .map(it => (
                      <div key={it.code} className="flex justify-between items-center text-xs p-1.5 bg-white rounded-lg">
                        <span className="truncate flex-1">{it.desc}</span>
                        <button
                          onClick={() => {
                            const next = [...editingReceipt.items, {
                              code: it.code,
                              desc: it.desc,
                              price: it.price,
                              cost: it.cost || 0,
                              qty: 1,
                              discountPercent: 0,
                              lineTotal: it.price,
                              lineProfit: it.price - (it.cost || 0)
                            }];
                            setEditingReceipt({ ...editingReceipt, items: next });
                            setEditItemSearch("");
                          }}
                          className="bg-brand-800 text-white px-2 py-0.5 rounded-md font-bold tap-bounce ml-1 text-[10px]"
                        >
                          + Agregar
                        </button>
                      </div>
                    ))}
                </div>
              )}
            </div>

            <button
              onClick={saveReceiptEdits}
              className="w-full bg-brand-800 hover:bg-brand-900 text-white font-extrabold py-3.5 rounded-2xl text-sm tap-bounce shadow-md"
            >
              Guardar Cambios y Recalcular
            </button>
          </div>
        </div>
      )}

      {/* ===================== MODAL: ADD PRODUCT ===================== */}
      {addProductModal && (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-end justify-center p-0 backdrop-blur-xs" onClick={() => setAddProductModal(false)}>
          <div
            onClick={e => e.stopPropagation()}
            className="w-full max-w-[480px] bg-white rounded-t-3xl p-5 space-y-3.5"
          >
            <div className="flex items-center justify-between">
              <h3 className="font-black text-lg text-slate-900">Crear Producto Propio</h3>
              <button onClick={() => setAddProductModal(false)} className="p-1.5 text-slate-400 hover:bg-slate-100 rounded-full">
                <XIcon size={20} />
              </button>
            </div>

            <div className="space-y-3">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Descripción / Nombre</label>
                <input
                  type="text"
                  placeholder="Ej: Alcohol en spray 500ml..."
                  value={newProd.name}
                  onChange={e => setNewProd({ ...newProd, name: e.target.value })}
                  className="w-full p-3 rounded-xl bg-slate-50 border border-slate-300 font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Precio Venta ($)</label>
                  <input
                    type="number"
                    placeholder="3500"
                    value={newProd.price}
                    onChange={e => setNewProd({ ...newProd, price: e.target.value })}
                    className="w-full p-3 rounded-xl bg-slate-50 border border-slate-300 font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Costo ($ opcional)</label>
                  <input
                    type="number"
                    placeholder="2000"
                    value={newProd.cost}
                    onChange={e => setNewProd({ ...newProd, cost: e.target.value })}
                    className="w-full p-3 rounded-xl bg-slate-50 border border-slate-300 font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">Categoría</label>
                <input
                  type="text"
                  placeholder="Mis productos"
                  value={newProd.category}
                  onChange={e => setNewProd({ ...newProd, category: e.target.value })}
                  className="w-full p-3 rounded-xl bg-slate-50 border border-slate-300 font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
              </div>

              <div className="flex items-center gap-2 pt-1">
                <input
                  type="checkbox"
                  id="prodOffer"
                  checked={newProd.offer}
                  onChange={e => setNewProd({ ...newProd, offer: e.target.checked })}
                  className="w-4 h-4 text-brand-800 rounded focus:ring-brand-500"
                />
                <label htmlFor="prodOffer" className="text-xs font-bold text-slate-700">
                  Destacar como artículo en Oferta
                </label>
              </div>
            </div>

            <button
              onClick={createCustomProduct}
              className="w-full bg-brand-800 hover:bg-brand-900 text-white font-extrabold py-3.5 rounded-2xl text-sm tap-bounce shadow-md mt-2"
            >
              Guardar en Catálogo Local
            </button>
          </div>
        </div>
      )}

      {/* ===================== MODAL: SETTINGS & BACKUP ===================== */}
      {settingsModal && (
        <div className="fixed inset-0 bg-black/60 z-50 flex items-end justify-center p-0 backdrop-blur-xs" onClick={() => setSettingsModal(false)}>
          <div
            onClick={e => e.stopPropagation()}
            className="w-full max-w-[480px] bg-white rounded-t-3xl p-5 space-y-4"
          >
            <div className="flex items-center justify-between">
              <div>
                <h3 className="font-black text-lg text-slate-900">Configuración & Resguardo</h3>
                <p className="text-xs text-slate-500">Herramientas del sistema y copias de seguridad</p>
              </div>
              <button onClick={() => setSettingsModal(false)} className="p-1.5 text-slate-400 hover:bg-slate-100 rounded-full">
                <XIcon size={20} />
              </button>
            </div>

            <div className="space-y-3">
              {/* Folder sync with File System Access API */}
              <div className="p-3.5 bg-slate-50 rounded-2xl border border-slate-200 space-y-2">
                <div className="flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <FolderIcon size={18} className="text-brand-800" />
                    <span className="font-bold text-xs text-slate-800">Guardado Directo en Carpeta</span>
                  </div>
                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${dirHandle ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-500'}`}>
                    {dirHandle ? "Conectada" : "Inactiva"}
                  </span>
                </div>
                <p className="text-[11px] text-slate-500 leading-snug">
                  Selecciona una carpeta física en tu celular o equipo para descargar automáticamente las imágenes PNG de los tickets emitidos.
                </p>
                <button
                  onClick={handleSelectFolder}
                  className="w-full bg-white border border-slate-300 hover:bg-slate-50 text-slate-800 text-xs font-bold py-2.5 rounded-xl tap-bounce"
                >
                  {dirHandle ? `Cambiar carpeta (${dirHandle.name})` : "Seleccionar Carpeta del Dispositivo"}
                </button>
              </div>

              {/* JSON Backup & Restore */}
              <div className="p-3.5 bg-slate-50 rounded-2xl border border-slate-200 space-y-2.5">
                <div className="flex items-center gap-2">
                  <DownloadIcon size={18} className="text-brand-800" />
                  <span className="font-bold text-xs text-slate-800">Copia de Seguridad Completa</span>
                </div>
                <p className="text-[11px] text-slate-500">
                  Exporta todos tus recibos, clientes guardados y productos propios en un archivo JSON.
                </p>
                <div className="grid grid-cols-2 gap-2">
                  <button
                    onClick={exportFullBackup}
                    className="bg-brand-800 hover:bg-brand-900 text-white text-xs font-bold py-2.5 rounded-xl tap-bounce"
                  >
                    Exportar Backup
                  </button>
                  <button
                    onClick={() => fileInputRef.current && fileInputRef.current.click()}
                    className="bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold py-2.5 rounded-xl tap-bounce"
                  >
                    Restaurar Backup
                  </button>
                  <input
                    type="file"
                    ref={fileInputRef}
                    onChange={handleImportBackup}
                    accept=".json"
                    className="hidden"
                  />
                </div>
              </div>
            </div>

            <div className="pt-2 text-center text-[10px] text-slate-400 font-mono">
              GP Distribuciones · WhatsApp: +{OWNER_WHATSAPP}
            </div>
          </div>
        </div>
      )}

      {/* Floating Toast Message */}
      {toastMessage && (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-brand-900/95 backdrop-blur-md text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-2xl flex items-center gap-2 border border-white/10 animate-in fade-in slide-in-from-top-3 duration-200">
          <SparklesIcon size={14} className="text-accent" />
          <span>{toastMessage}</span>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
